name: ModelStack reproducibility checks
on:
  push:
  pull_request:
jobs:
  portable-checks:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline Python tests, CLI, and native C++ checks
        run: python scripts/release_check.py
  # GPU-dependent training and CUDA profiling are intentionally NOT marked as
  # verified by CPU-only CI. Run them on dedicated, correctly provisioned GPUs.
